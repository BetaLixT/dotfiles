[dmenu]
dmenu_command = rofi -dmenu -i
highlight = True
highlight_fg = #957FB8
highlight_bg = #2A2A37
highlight_bold = True
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
prompt = Network

[dmenu_passphrase]
obscure = True
obscure_color = #1F1F28

[editor]
terminal = alacritty
gui_if_available = True

[nmdm]
rescan_delay = 5
show_notifications = True
