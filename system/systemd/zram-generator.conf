# zram — tier-1 swap: compressed RAM, consumed before the disk swapfile.
#
# This file was previously hand-created on the machine as a bare `[zram0]`
# stanza owned by no package, so every value below came from an unstated default
# and was invisible to this repo. The values are written out explicitly here to
# match what the machine was already running (verified 2026-08-10:
# /sys/block/zram0/disksize = 4294967296, comp_algorithm = zstd, swap prio 100),
# so behaviour is unchanged but no longer implicit.
#
# Requires the `zram-generator` package. systemd-zram-setup@zram0.service is
# generated from this file at boot; there is nothing to enable manually.
#
# Ordering matters to the rest of the memory setup: this device takes priority
# 100 and /swap/swapfile takes 10, so compressed RAM is always used first and
# the disk file is the emergency tier. earlyoom's `-s` thresholds are
# percentages of *total* swap (zram + swapfile), so changing zram-size shifts
# when earlyoom acts -- see system/default/earlyoom.

[zram0]
# 4 GiB here (min(31770/2, 4096) on this 32 GB machine). Raising this trades RAM
# for headroom: zram pages cost real memory once compressed, roughly 1/3 of the
# nominal size at typical ratios.
zram-size = min(ram / 2, 4096)

# zstd gives a better ratio than lzo-rle at a small CPU cost. Note the CPU cost
# is paid during reclaim, i.e. exactly when the machine is already struggling.
compression-algorithm = zstd

# Must stay above the swapfile's pri=10 in /etc/fstab.
swap-priority = 100
