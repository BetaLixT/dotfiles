# Lid behaviour, deployed to /etc/systemd/logind.conf.d/10-lid.conf
#
# Goal: on AC the machine stays awake with the lid shut (sway blanks the internal
# panel instead, see the bindswitch lines in sway/config). On battery it suspends.
#
# The default for HandleLidSwitchExternalPower is `suspend`, which is why closing
# the lid while plugged in used to sleep the machine. Arch ships every one of
# these commented out, so all three were at their defaults before this file.
#
# HandleLidSwitchDocked is already `ignore` by default; stated here explicitly so
# the whole policy is visible in one place rather than half-implied by defaults.
#
# NOTE: logind does not reliably re-read this on SIGHUP, and
# `systemctl restart systemd-logind` can disrupt or kill active sessions. The
# install script deliberately does NOT restart it — this takes effect at the
# next boot.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
