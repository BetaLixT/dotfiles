# Memory tuning to make exhaustion a slope instead of a cliff.
# Added after the 2026-08-10 stall (see docs/freeze-diagnosis.md).

# Start reclaiming much earlier. Default 10 (= 0.1% of RAM, ~31 MB here) means
# kswapd only wakes when free memory is already nearly gone, so a fast allocator
# outruns reclaim and every task stalls in direct reclaim. 125 (~1.25%, ~390 MB)
# buys reclaim enough runway to keep up, at the cost of a little idle RAM.
vm.watermark_scale_factor = 125

# Prefer swapping anonymous pages over evicting page cache. zram is compressed
# RAM -- swapping to it is far cheaper than re-reading evicted binaries from
# disk, and it holds the top-priority swap slot so it fills before the disk
# swapfile does.
vm.swappiness = 100

# Swap readahead: 2^3 = 8 pages by default, which assumes rotational locality.
# zram is true random-access, so readahead just burns CPU decompressing pages
# nothing asked for. 0 = read exactly what faulted.
vm.page-cluster = 0
