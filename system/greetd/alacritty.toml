# Alacritty config used ONLY by the greetd login screen.
#
# Why a separate copy: greetd runs the greeter as the `greeter` user, which
# cannot read /home/dcruza/.config/alacritty. This file must live somewhere
# world-readable, so it is deployed to /etc/greetd/alacritty.toml.
#
# Keep the colours in sync with alacritty-lnx/alacritty.toml by hand - there is
# no include mechanism. Only the primary/normal/bright colours and the font are
# copied; window padding is widened slightly since this is a full-screen greeter.

[colors.primary]
background = "0x1F1F28"
foreground = "0xdcd7ba"

[colors.normal]
black   = "0x090618"
red     = "0xc34043"
green   = "0x76946a"
yellow  = "0xc0a36e"
blue    = "0x7e9cd8"
magenta = "0x957fb8"
cyan    = "0x6a9589"
white   = "0xc8c093"

[colors.bright]
black   = "0x727169"
red     = "0xe82424"
green   = "0x98bb6c"
yellow  = "0xe6c384"
blue    = "0x7fb4ca"
magenta = "0x938aa9"
cyan    = "0x7aa89f"
white   = "0xdcd7ba"

[font]
size = 14.0

[font.normal]
family = "SFMono Nerd Font"
style = "Regular"

[window]
decorations = "none"
dynamic_padding = false
opacity = 1.0

[window.padding]
x = 8
y = 8
