# Session-wide environment, deployed to ~/.config/environment.d/10-desktop.conf
#
# WHY THIS FILE EXISTS: these used to be exported from .zshrc-lnx, which worked
# only because sway was launched from an interactive zsh after a TTY login. Since
# greetd took over (2026-09-11) it execs the session directly, and greetd's
# source_profile only reads /etc/profile and ~/.profile - never ~/.zshrc, which
# is for interactive shells. Everything set there vanished from the session, and
# GTK apps launched by sway fell back to the light theme.
#
# IMPORTANT: environment.d is read by `systemd --user`, so on its own it reaches
# user *services* only. sway is spawned by greetd into session-N.scope, NOT as a
# systemd unit, so it does not inherit this automatically. scripts/start-sway.sh
# sources this directory before exec'ing sway - that is what makes sway and every
# app it launches see these values. Keep the two in step.
#
# Only session-wide values belong here. Deliberately NOT moved from .zshrc-lnx:
# PATH (zsh manages it, and duplicating it here risks divergence), JAVA_HOME,
# GOPRIVATE, NVM_DIR, PNPM_HOME, NEWT_COLORS - all developer-shell concerns that
# no GUI app needs.

# GTK theme for every GUI app. Theme lives in /usr/share/themes/Kanagawa-Dark.
# gtk-3.0/settings.ini also sets gtk-theme-name and
# gtk-application-prefer-dark-theme=1, but GTK only consults settings.ini when no
# XSettings provider is present, so the env var is the reliable path.
GTK_THEME=Kanagawa-Dark

# Some GUI apps spawn $EDITOR; without this they fall back to vi.
EDITOR=nvim
